<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Anti-flash theme init: sets data-theme on <html> before React paints
      // so the correct palette (see src/index.css) applies from first render.
      // The storage key mirrors STORAGE_KEYS.theme (src/shared/constants/storage.ts)
      // and the resolution rules mirror src/shared/theme/themeTypes.ts; both are
      // duplicated here in plain JS because this runs before any module loads.
      (function () {
        try {
          var STORAGE_KEY = 'league-list:theme:v1';
          var VALID_PREFERENCES = ['light', 'dark'];
          var stored = window.localStorage.getItem(STORAGE_KEY);
          var theme =
            VALID_PREFERENCES.indexOf(stored) !== -1
              ? stored
              : typeof window.matchMedia === 'function' &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          // localStorage/matchMedia unavailable; the app falls back to its default theme.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse sports leagues, filter by name and sport, and view season badges."
    />
    <title>Sports Leagues</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
